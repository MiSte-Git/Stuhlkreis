<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stuhlkreis Bestellungen</title>
    <link rel="icon" href="thumbnail.png" type="image/png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=12" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-row">
        <img class="brand-thumb" src="thumbnail.png" alt="Stuhlkreis Logo" />
        <div class="brand">Stuhlkreis Bestellungen</div>
      </div>
      <a class="site-link" href="https://www.dgtextildruck.de/" target="_blank" rel="noopener noreferrer">
        https://www.dgtextildruck.de/
      </a>
      <a class="site-link" href="https://www.dropbox.com/scl/fo/jkags2rjh755v1trdmqt0/h?rlkey=b1dz71ig8sy6xbjlf372itxq4&dl=0" target="_blank" rel="noopener noreferrer">
        Druckvorlagen -> Dropbox
      </a>
    </header>

    <main class="container">
      <section class="panel toolbar" aria-label="Aktionen">
        <div class="toolbar-row">
          <label class="sheet-picker" for="sheetSelect">
            <span class="visually-hidden">Tabellenblatt wechseln</span>
            <select id="sheetSelect"></select>
          </label>
          <button id="newSheet" type="button" class="icon-btn" title="Neues Tabellenblatt" aria-label="Neues Tabellenblatt">＋</button>
          <button id="sheetMenuButton" type="button" class="icon-btn" title="Weitere Aktionen" aria-label="Weitere Aktionen">⋯</button>
        </div>
        <div class="toolbar-row toolbar-actions">
          <button id="openExport" type="button" class="action-btn">⬇ Export</button>
          <button id="printSheet" type="button" class="action-btn action-print">🖨 Drucken</button>
          <button id="toggleLock" type="button" class="action-btn action-lock">🔒 Abschließen</button>
        </div>
        <div id="lastSaved" class="save-state"></div>
      </section>

      <div id="grandTotal" class="meta grand-total"></div>

      <section class="sheet" aria-live="polite">
        <button id="sheetTitle" type="button" class="sheet-title" title="Tabellenblatt umbenennen"></button>
        <div class="sheet-scroll">
          <table id="sheetTable" class="sheet-table">
            <thead></thead>
            <tbody></tbody>
          </table>
        </div>
        <div class="sheet-add">
          <button id="addPerson" type="button" class="ghost-btn">＋ Person</button>
          <button id="addArticle" type="button" class="ghost-btn">＋ Artikel</button>
        </div>
        <p class="sheet-hint">Tipp: Über ⋮ bei Name oder Artikel kannst du einfügen, verschieben und löschen.</p>
      </section>

      <section id="invoiceSection" class="panel invoices" aria-label="Rechnungen">
        <div class="invoices-head">
          <h2 class="section-title">Rechnungen <span id="invoiceCount" class="count-badge"></span></h2>
          <label class="file-input upload-btn">
            <input id="invoiceInput" type="file" accept="application/pdf" multiple />
            <span>＋ Rechnung hochladen</span>
          </label>
        </div>
        <input id="invoiceSearch" class="invoice-search" type="search" placeholder="Rechnungen durchsuchen" hidden />
        <div id="invoicePreviewList" class="invoice-list"></div>
        <p class="drop-hint">PDF-Dateien kannst du auch hierher ziehen.</p>
        <select id="invoiceSheet" hidden aria-hidden="true"></select>
        <select id="invoiceSelect" hidden aria-hidden="true"></select>
      </section>
    </main>

    <div id="status" class="toast" role="status" aria-live="polite"></div>

    <dialog id="exportDialog" class="sheet-dialog" aria-labelledby="exportTitle">
      <div class="dialog-body">
        <h3 id="exportTitle">Export und Drucken</h3>
        <label class="select-field" for="downloadScope">
          Umfang
          <select id="downloadScope">
            <option value="active" selected>Nur aktuelles Tabellenblatt</option>
            <option value="all">Alle Tabellenblätter</option>
          </select>
        </label>
        <label class="select-field" for="pdfOrientation">
          Seitenformat (PDF und Druck)
          <select id="pdfOrientation">
            <option value="portrait">Hochformat</option>
            <option value="landscape" selected>Querformat</option>
          </select>
        </label>
        <div class="dialog-actions">
          <button id="download" type="button" class="action-btn">⬇ Excel</button>
          <button id="downloadPdf" type="button" class="action-btn">⬇ PDF</button>
          <button id="printFromDialog" type="button" class="action-btn action-print">🖨 Drucken</button>
        </div>
        <button type="button" class="ghost-btn dialog-close" data-close>Schließen</button>
      </div>
    </dialog>

    <dialog id="actionSheet" class="sheet-dialog" aria-labelledby="actionSheetTitle">
      <div class="dialog-body">
        <h3 id="actionSheetTitle"></h3>
        <div id="actionSheetList" class="action-list"></div>
        <button type="button" class="ghost-btn dialog-close" data-close>Abbrechen</button>
      </div>
    </dialog>

    <input id="fileInput" type="file" accept=".xlsx,.xls" hidden />
    <input id="showLocked" type="checkbox" hidden />

    <footer class="site-footer">
      Bearbeitung im Browser, Excel-Export mit SheetJS.
    </footer>

    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script>
      if (!window.XLSX) {
        document.write('<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"><\/script>');
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
    <script src="app.js?v=12"></script>
  </body>
</html>
